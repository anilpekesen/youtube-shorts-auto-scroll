<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="28" height="28">
    <h1 data-i18n="extName"></h1>
  </header>

  <section class="card">
    <label class="switch-row">
      <span data-i18n="autoScroll"></span>
      <input type="checkbox" id="enabled" class="switch">
    </label>
    <div id="status" class="status"><i></i><span></span></div>
  </section>

  <div id="notice" class="notice" hidden></div>

  <section class="card donate">
    <div class="donate-head">
      <span class="heart" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      </span>
      <div>
        <h2 data-i18n="donateTitle"></h2>
        <p data-i18n="donateText"></p>
      </div>
    </div>

    <div class="coin">
      <span class="coin-badge" aria-hidden="true">₮</span>
      <div class="coin-name">
        <strong id="coin"></strong>
        <small id="network"></small>
      </div>
      <button id="qr-toggle" class="ghost" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 20h4v-3"/></svg>
        <span data-i18n="showQr"></span>
      </button>
    </div>

    <div id="qr" class="qr" hidden>
      <img src="donate-qr.svg" alt="" width="148" height="148">
    </div>

    <div class="address-row">
      <code id="address"></code>
      <button id="copy" class="icon-btn">
        <svg class="i-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
        <svg class="i-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </div>

    <p class="hint">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span data-i18n="donateWarning"></span>
    </p>
  </section>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
