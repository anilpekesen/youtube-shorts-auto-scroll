<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1 data-i18n="extName"></h1>
  </header>

  <label class="row toggle">
    <span data-i18n="autoScroll"></span>
    <input type="checkbox" id="enabled">
  </label>

  <div id="status" class="status"></div>
  <div id="notice" class="notice" hidden></div>

  <section class="donate">
    <h2 data-i18n="donateTitle"></h2>
    <p data-i18n="donateText"></p>
    <p class="warn" data-i18n="donateWarning"></p>
    <div class="network" id="network"></div>
    <div class="address-row">
      <code id="address"></code>
      <button id="copy" data-i18n="copy"></button>
    </div>
  </section>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
